projects:
    title: Projects
    intro: >
    
    assignments:
      - title: GIT-base Ablation Study
        link: "https://github.com/jeet1912/ms/blob/main/ds677_2/project/GITAblationStudy.pdf"
        tagline: |
          - Engineered and preprocessed MIMIC-CXR-JPG v2.1.0 (377K+ chest X-rays, 227K reports) via GCP BigQuery and CheXpert, generating structured mini-reports and building a balanced 66K+ study dataset with robust stratified splits.
          - Implemented and benchmarked GIT-base vision–language architecture under Full Fine-Tuning vs. LoRA (vision-only, text-only), designing a resource-optimized training strategy that reduced GPU memory usage by 50% and training time by 67%.
          - Demonstrated 5.8× improvement in BLEU with LoRA Text-Only over full fine-tuning, validating LoRA as a parameter-eﬃcient and domain-adaptive strategy for medical vision–language tasks.
 
            [[Code Repository]](https://github.com/jeet1912/gitbase_ablationStudy)

      - title: Sepsis Treatment with Deep Reinforcement Learning
        link: "https://github.com/jeet1912/ms/blob/main/ds699/project/FinalReportGroup1.pdf"
        tagline: |
          - Implemented a reinforcement learning framework (WD3QNE) for ICU sepsis treatment, replicating published results across 8 experiments with 43 vs. 45 feature sets.
          - Processed and curated MIMIC-III data (14,505 patients, 344,800 records) using hierarchical time-aware imputation and Sepsis-3 cohort selection.
          - Reduced feature set from 45 to 43 via sequential backward selection, improving interpretability while maintaining model stability.
          - Trained agents over 100 epochs, achieving structured 5×5 fluid/vasopressor policies aligned with clinician behavior and robust survival outcomes.

            [[Code Repository]](https://github.com/tblicharznjit/DS669_Group1)
 
        
      - title: Comparative Study of Selected Clustering Algorithms with Generated Datasets
        link: "https://github.com/jeet1912/ms/blob/main/cs634/finalTermProject/abhijeet_sahdev_finalTermProject.pdf"
        tagline: |
          - Performed data mining in benchmarking unsupervised ML algorithms such as K-Means and Hierarchical Agglomerative Clustering on GenAI-generated datasets with outliers removed using IQR to enhance pattern discovery.
          - Achieved top silhouette scores with K-Means on Dataset 1 (0.359, 3 clusters) and Dataset 2 (0.625, 2 clusters), and with Agglomerative on Dataset 3 (0.984, 2 clusters).
           
