career-profile:
    title: Career Profile
    summary: |
      Graduate Student in Artificial Intelligence at <b> New Jersey Institute of Technology's Ying Wu College of Computing in Newark, New Jersey, USA</b>. Completed undergraduate degree from <b>Manipal Institute of Technology, India</b> in <b>Computer Science and Engineering</b> with a  minor in <b>Computational Mathematics</b>. Highly motivated and results-driven Software Engineer with a strong foundation in full-stack development, cloud computing, and  passionate about applications of technology to facilitate positive social change.
      Committed to continuous learning and staying at the forefront of emerging technologies. 
      
      <b>Primary Interests</b>: Deep Learning.
      
      <b>Secondary Interests</b>: Blockchain technology.
       
      [[MOOCs]](https://jeet1912.github.io/assets/docs/moocs.pdf) [[Certificates]](https://jeet1912.github.io/assets/docs/certificates.pdf)
      
