projects:
    title: Projects
    intro: >
    
    assignments:
      - title: Distributed Ridge Regression on Healthcare Data using Hadoop MapReduce
        link: "https://github.com/jeet1912/ms/blob/main/ds644/midTermProj/sahdev_abhijeet_midtermproj.pdf"
        tagline: |
          - Designed and implemented a distributed machine learning pipeline for healthcare cost prediction using Hadoop MapReduce on a multi-node AWS cluster. The system processes the SPARCS Hospital Inpatient Discharges dataset (≈1.9 GB after preprocessing) and trains a Ridge Regression model with K-fold cross-validation, computing model parameters and evaluation metrics entirely in a distributed setting.
          - The implementation reformulates linear regression as distributed sufficient-statistics aggregation, where mappers compute partial Gram matrices **(XᵀX)** and cross terms **(Xᵀy)**, combiners reduce network overhead, and reducers solve the regularized normal equations. A separate evaluation job computes **R²** metrics per fold using MapReduce.
          - The pipeline demonstrates how classical ML algorithms can be translated into fault-tolerant, large-scale data-parallel workflows, achieving stable performance (mean R² ≈ 0.786 across 5 folds) on real-world clinical data (SPARCS).
 
            [[Code Repository]](https://github.com/jeet1912/sparcs) [[Report]](https://github.com/jeet1912/ms/blob/main/ds644/midTermProj/sahdev_abhijeet_midtermproj.pdf) 

      - title: Distributed GPT-2 
        link: "https://github.com/jeet1912/ms/blob/main/cs698/project/docs/project.pdf"
        tagline: |
          - Implemented a minimal GPT-2 in C++ with custom autograd, CUDA kernels, tokenizer/dataloader, and Adam optimizer to study
            transformer internals.
          - Extended to distributed training with MPI data parallelism, gradient allreduce, and rank-aware batching across multi-GPU nodes.
          - Achieved 67× training and 14× inference speedups (226s vs. 15,264s CPU baseline) while maintaining model quality.
 
            [[Code Repository]](https://github.com/felixg318/HPC-GPT2) [[Report]](https://github.com/jeet1912/ms/blob/main/cs698/project/docs/project.pdf) 

      - title: GIT-base Ablation Study
        link: "https://github.com/jeet1912/ms/blob/main/ds677_2/project/GITAblationStudy.pdf"
        tagline: |
          - Engineered and preprocessed MIMIC-CXR-JPG v2.1.0 (377K+ chest X-rays, 227K reports) via GCP BigQuery and CheXpert, generating structured mini-reports and building a balanced 66K+ study dataset with robust stratified splits.
          - Implemented and benchmarked GIT-base vision–language architecture under Full Fine-Tuning vs. LoRA (vision-only, text-only), designing a resource-optimized training strategy that reduced GPU memory usage by 50% and training time by 67%.
          - Demonstrated 5.8× improvement in BLEU with LoRA Text-Only over full fine-tuning, validating LoRA as a parameter-eﬃcient and domain-adaptive strategy for medical vision–language tasks.
 
            [[Code Repository]](https://github.com/jeet1912/gitbase_ablationStudy) [[Report]](https://github.com/jeet1912/ms/blob/main/ds677_2/project/GITAblationStudy.pdf)

      - title: Sepsis Treatment with Deep Reinforcement Learning
        link: "https://github.com/jeet1912/ms/blob/main/ds699/project/FinalReportGroup1.pdf"
        tagline: |
          - Implemented a reinforcement learning framework (WD3QNE) for ICU sepsis treatment, replicating published results across 8 experiments with 43 vs. 45 feature sets.
          - Processed and curated MIMIC-III data (14,505 patients, 344,800 records) using hierarchical time-aware imputation and Sepsis-3 cohort selection.
          - Reduced feature set from 45 to 43 via sequential backward selection, improving interpretability while maintaining model stability.
          - Trained agents over 100 epochs, achieving structured 5×5 fluid/vasopressor policies aligned with clinician behavior and robust survival outcomes.

            [[Code Repository]](https://github.com/tblicharznjit/DS669_Group1) [[Report]](https://github.com/jeet1912/ms/blob/main/ds669/project/FinalReportGroup1.pdf)
         
      - title: Comparative Study of Selected Clustering Algorithms with Generated Datasets
        link: "https://github.com/jeet1912/ms/blob/main/cs634/finalTermProject/abhijeet_sahdev_finalTermProject.pdf"
        tagline: |
          - Performed data mining in benchmarking unsupervised ML algorithms such as K-Means and Hierarchical Agglomerative Clustering on GenAI-generated datasets with outliers removed using IQR to enhance pattern discovery.
          - Achieved top silhouette scores with K-Means on Dataset 1 (0.359, 3 clusters) and Dataset 2 (0.625, 2 clusters), and with Agglomerative on Dataset 3 (0.984, 2 clusters).
           
            [[Code Repository]](https://github.com/jeet1912/ms/blob/main/cs634/finalTermProject/CS634FTPbyAS.ipynb) [[Report]](https://github.com/jeet1912/ms/blob/main/cs634/finalTermProject/abhijeet_sahdev_finalTermProject.pdf)

      - title: Open Source Contribution
        link: "https://github.com/toystars/react-native-multiple-select/pull/171"
        tagline: |
