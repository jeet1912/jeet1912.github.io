experiences:
    - role: Research Assistant
      time: Sept 2025 - Ongoing
      company: Xu Lab, NJIT
      details: |
        Currently working on HyperMedDiff-Risk under [Prof. Mengjia Xu](https://gracexu182.github.io).
          - Designed a geometry-aware generative framework to study how latent curvature and transport govern hierarchy preservation in clinical risk prediction.
          - Developed a synthetic ICD trajectory benchmark using rooted-tree ontologies to isolate geometry–accuracy trade-offs between Euclidean and hyperbolic diffusion and rectified-flow models.
          - Introduced HyperMedDiff-Risk, integrating hyperbolic ICD embeddings, graph diffusion encoders, and rectified-flow transport to prevent hierarchical collapse during generation.
          - Achieved state-of-the-art performance on MIMIC-III heart-failure prediction (AUPRC 0.79–0.83 vs. 0.706 MedDiffusion; Cohen’s κ ≈ 0.50), with ablations quantifying curvature, diffusion depth, and decoder expressivity.
          - Trained hyperbolic ICD embeddings with HDD-supervised alignment (Corr = 0.84–0.91), substantially improving hierarchical fidelity over Euclidean baselines; manuscript in preparation.
    
    - role: Research Assistant
      time: May 2025 - Ongoing
      company: Immersive Creation Lab, NJIT
      details: |
        Currently working on a web-based implementation of 3D Copilot under [Prof. Lei Zhang](https://raynez.art/bio/).
          - Building a browser-native 3D copilot for controllable scene generation, integrating React, react-three-fiber, Sketchfab retrieval, and an LLM-driven staging and commit workflow.
          - Developed a GLB optimization and streaming pipeline (gltf-transform, Draco, texture compression), reducing 3D asset load times by 13% for interactive editing.
          - Designed a structured prompting and tool-calling specification (1.6K+ lines) encoding spatial constraints, collision checks, quadrant heuristics, and safe animation rules.
          - Prototyping GNN-based scene representations to model relational and geometric structure for controllable 3D generation.
          - Supporting a production-grade UIST submission and longitudinal user studies on spatially grounded human–AI interfaces.
        
    - role: Teaching Assistant
      time: Aug 2024 - Dec 2024
      company: YWCC, NJIT
      details: |
        In my role as a TA for CS 482 Data Mining class, I was responsible for grading assignments and creating answers keys for 20+ students as well as invigilating the exams.

    - role: Desk Attendant
      time: Aug 2024 - Oct 2024
      company: ResLife, NJIT
      details: |
        In my role as a desk attendant at various dorms situated on campus, my key responsibilities including tagging in residents, maintaining logs of guests and ensuring that all Reslife policies were abided by people in and around dorms.

      
    - role: Software Engineering Intern
      time: Dec 2020 – Jun 2021
      company: MyHealthToday, San Francisco
      details: |
        In this role, I collaborated with [Mr. Parth Srivastav](https://www.linkedin.com/in/parth-srivastav/) to build a minimum viable product of a patient engagement service that empowers senior citizens to self report their health information.
          - Developed a cross-platform front-end using React for web browsers and React Native for mobile app to ensure responsiveness across devices.
          - Developed test suites to ensure that the application adhered to the design and was supported on target customer devices.
          - Implemented several Design Patterns like adapter, state and observer using React-Redux to create a single source of truth while developing the mobile app.
          - Standardized formats of records in DynamoDB table using a script, preventing run-time errors in the future.
          - Developed microservices using serverless AWS Lambda functions to create a scalable backend for the mobile and Alexa application.
          - Designed, coded and deployed RESTful APIs using SAM CLI and AWS CI/CD tools, reducing resource creation time at client side by 16%.
        
        Skills - Fullstack Development, Project Management and Strategic Thinking.
        
        [[About MHT]](https://innovation.uci.edu/2020/09/myhealthtoday-closed-beta-launch/) [[Project Report]](https://jeet1912.github.io/assets/docs/170905316_FinalReport.pdf) [[Youtube Demo]](https://www.youtube.com/watch?v=MPmevUA6ZSg)
    
    - role: Application Developer Intern
      time: Sept 2020 – Nov 2020
      company: Dystopia, Bangalore
      details: |
        [Dystopia](https://www.instagram.com/dystopia_india/) is a student-run animal welfare organisation. Through this app, they aimed to eliminate the need of a breeder/middleman.
          - Collaborated with a team of developers and designers on a pet adoption app from scratch following Layered Architecture.
          - Developed clean UI following the designs using standard Flutter widgets and packages from pub.dev.
          - Implemented user authentication and SSO using Firebase, reflecting state changes using Provider. 
