career-profile:
    title: Career Profile
    summary: |
      Graduate student in <b>Artificial Intelligence</b> at <b>New Jersey Institute of Technology</b>. I work on <b>geometric and generative models for structured clinical data</b>, focusing on hyperbolic diffusion/flow models and graph encoders for EHR and ontology-grounded risk prediction. I build end-to-end systems (CUDA/MPI) and validate them on MIMIC-scale datasets, aiming for methods that are both <b>mathematically grounded</b> and <b>clinically meaningful</b>. My goal is to ship research-grade models that preserve clinical hierarchy, remain interpretable, and scale reliably.
      
