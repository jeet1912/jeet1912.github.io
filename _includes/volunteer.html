{% assign volunteer = site.data.data.volunteer %}
{% if volunteer %}
<section class="section volunteer-section">
  <h2 class="section-title">
    Volunteer
  </h2>

  {% for item in volunteer %}
  <div class="item">

    <div class="meta">

      <div class="upper-row">
        <h3 class="job-title">{{ item.role }}</h3>
        <div class="time">{{ item.time }}</div>
      </div><!--//upper-row-->

      <div class="company">{{ item.company }}</div>

    </div><!--//meta-->

    {% if item.details %}
    <div class="details" align="justify">
      {{ item.details | markdownify }}
    </div><!--//details-->
    {% endif %}

  </div><!--//item-->
  {% endfor %}

</section><!--//section-->
{% endif %}
