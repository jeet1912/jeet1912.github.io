{% assign campus = site.data.data['campus-experience'] %}
{% if campus %}
<section class="section campus-section">
  <h2 class="section-title">
    <span class="fa-stack fa-xs">
      <i class="fas fa-circle fa-stack-2x"></i>
      <i class="fas fa-user-graduate fa-stack-1x fa-inverse"></i>
    </span>
    {{ campus.title }}
  </h2>

  {% for role in campus.roles %}
  <div class="item">

    <div class="meta">

      <div class="upper-row">
        <h3 class="job-title">{{ role.role }}</h3>
        <div class="time">{{ role.time }}</div>
      </div><!--//upper-row-->

      <div class="company">{{ role.company }}</div>

    </div><!--//meta-->

    {% if role.details %}
    <div class="details" align="justify">
      {{ role.details | markdownify }}
    </div><!--//details-->
    {% endif %}

  </div><!--//item-->
  {% endfor %}

</section><!--//section-->
{% endif %}
